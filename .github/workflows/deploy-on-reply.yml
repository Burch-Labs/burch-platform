name: Deploy on Reply

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      (github.event.issue.pull_request && contains(github.event.comment.body, '/deploy')) ||
      (github.event.pull_request && contains(github.event.comment.body, '/deploy'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.event.issue.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: cd apps/web && npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run tests
        run: cd apps/web && npm run test 2>/dev/null || true
        continue-on-error: true

      - name: Comment on PR/Issue
        uses: actions/github-script@v7
        with:
          script: |
            const message = `✅ Deployment triggered by @${context.actor}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Deploy to Replit
        run: |
          echo "Deployment to production would happen here"
          echo "Current build is ready for deployment"
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.REPLIT_DEPLOYMENT_TOKEN }}
