name: Secret scan

# This repository has already leaked a private key once — an SSH key sat in
# .replit and is still recoverable from history, because deleting a secret in a
# later commit does not remove it from earlier ones. This job exists so the next
# one is caught before it merges rather than after.
#
# It scans the incoming diff on a pull request, and the full history on a push
# to main, so a secret cannot arrive by either route.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs history to scan it; a shallow clone would only ever
          # see the tip and report clean on a repository full of secrets.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail on a populated secret in an env file
        # A belt-and-braces check gitleaks can miss: an env template committed
        # with real values in it. Empty assignments are how these files are
        # supposed to look, so anything after the "=" is the problem.
        run: |
          set -euo pipefail
          if git ls-files -z '*.env*' '.replit' \
            | xargs -0 -r grep -nE '^(MPESA|FLUTTERWAVE|RESEND|ANTHROPIC|OPENAI|NEXTAUTH|SESSION|TICKET|WHATSAPP|AFRICASTALKING|GITHUB|CLOUDINARY|DATABASE)[A-Z_]*=.+' \
            | grep -vE '=(sandbox|production|development|en)$' ; then
            echo ""
            echo "::error::A committed env file contains a populated secret."
            echo "Env files in this repository must ship empty. Move the value to"
            echo "your deployment environment, and treat the leaked value as burned —"
            echo "rotate it, because removing it from a later commit leaves it in history."
            exit 1
          fi
          echo "No populated secrets in committed env files."
